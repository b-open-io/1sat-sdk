<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>1Sat SDK — Docs Verification</title>
  <style>
    body { font-family: monospace; max-width: 800px; margin: 2rem auto; padding: 1rem; background: #111; color: #eee; }
    .pass { color: #4f4; }
    .fail { color: #f44; }
    h2 { border-bottom: 1px solid #333; padding-bottom: 0.5rem; }
    .test { padding: 2px 0; }
    #summary { margin-top: 2rem; padding: 1rem; border: 2px solid #333; font-size: 1.2rem; }
  </style>
</head>
<body>
  <h1>Docs Verification Test</h1>
  <p>Verifies every export, method, type, and error code documented in the developer docs exists in @1sat/connect.</p>

  <div id="results"></div>
  <div id="summary"></div>

  <script type="module">
    import {
      createOneSat,
      isOneSatInjected,
      isOneSatAvailable,
      waitForOneSat,
      getInjectedOneSat,
      getOneSat,
      OneSatBrowserProvider,
      PopupManager,

      // Errors
      ErrorCodes,
      OneSatError,
      UserRejectedError,
      WalletLockedError,
      WalletNotConnectedError,
      InsufficientFundsError,
      PopupBlockedError,
      PopupClosedError,
      TimeoutError,
      fromErrorResponse,

      // Messages
      PROTOCOL_VERSION,
      MessageTypes,
      createRequest,
      createResponse,
      createErrorResponse,
      isValidMessage,
      isResponse,

      // Storage
      saveConnection,
      loadConnection,
      clearConnection,
      hasStoredConnection,

      // Wallet-side utils
      parsePopupParams,
      sendResponse,
      sendErrorResponse,
      rejectRequest,
      walletLockedError,
      walletNotConnectedError,
      closePopup,
      isPopupContext,
      getPopupContext,

      // Values
      RpcMethods,
    } from '../../packages/connect/src/index.ts'

    const el = document.getElementById('results')
    const summaryEl = document.getElementById('summary')
    let passed = 0
    let failed = 0

    function test(name, condition) {
      const ok = !!condition
      if (ok) passed++; else failed++
      el.innerHTML += `<div class="test ${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✗'} ${name}</div>`
    }

    function section(name) {
      el.innerHTML += `<h2>${name}</h2>`
    }

    // -----------------------------------------------------------------------
    // 1. Core exports exist
    // -----------------------------------------------------------------------
    section('Core Exports')
    test('createOneSat is a function', typeof createOneSat === 'function')
    test('isOneSatInjected is a function', typeof isOneSatInjected === 'function')
    test('isOneSatAvailable is a function', typeof isOneSatAvailable === 'function')
    test('waitForOneSat is a function', typeof waitForOneSat === 'function')
    test('getInjectedOneSat is a function', typeof getInjectedOneSat === 'function')
    test('OneSatBrowserProvider is a class', typeof OneSatBrowserProvider === 'function')

    // -----------------------------------------------------------------------
    // 2. createOneSat returns a provider with all documented methods
    // -----------------------------------------------------------------------
    section('Provider Methods (OneSatProvider interface)')
    const wallet = createOneSat({ appName: 'Test' })

    // Connection
    test('connect() exists', typeof wallet.connect === 'function')
    test('disconnect() exists', typeof wallet.disconnect === 'function')
    test('isConnected() exists', typeof wallet.isConnected === 'function')

    // Signing
    test('signTransaction() exists', typeof wallet.signTransaction === 'function')
    test('signMessage() exists', typeof wallet.signMessage === 'function')

    // Ordinals
    test('inscribe() exists', typeof wallet.inscribe === 'function')
    test('sendOrdinals() exists', typeof wallet.sendOrdinals === 'function')

    // Listings
    test('createListing() exists', typeof wallet.createListing === 'function')
    test('purchaseListing() exists', typeof wallet.purchaseListing === 'function')
    test('cancelListing() exists', typeof wallet.cancelListing === 'function')

    // Tokens
    test('transferToken() exists', typeof wallet.transferToken === 'function')

    // Read-only
    test('getBalance() exists', typeof wallet.getBalance === 'function')
    test('getOrdinals() exists', typeof wallet.getOrdinals === 'function')
    test('getTokens() exists', typeof wallet.getTokens === 'function')
    test('getUtxos() exists', typeof wallet.getUtxos === 'function')

    // Events
    test('on() exists', typeof wallet.on === 'function')
    test('off() exists', typeof wallet.off === 'function')

    // Utility
    test('getAddresses() exists', typeof wallet.getAddresses === 'function')
    test('getIdentityPubKey() exists', typeof wallet.getIdentityPubKey === 'function')
    test('isOneSat === true', wallet.isOneSat === true)

    // -----------------------------------------------------------------------
    // 3. isConnected / getAddresses before connect
    // -----------------------------------------------------------------------
    section('Pre-connection State')
    test('isConnected() returns false before connect', wallet.isConnected() === false)
    test('getAddresses() returns null before connect', wallet.getAddresses() === null)
    test('getIdentityPubKey() returns null before connect', wallet.getIdentityPubKey() === null)

    // -----------------------------------------------------------------------
    // 4. Error classes and codes (must match docs exactly)
    // -----------------------------------------------------------------------
    section('Error Classes & Codes')

    const userErr = new UserRejectedError()
    test('UserRejectedError code = 4001', userErr.code === 4001)
    test('UserRejectedError instanceof OneSatError', userErr instanceof OneSatError)
    test('UserRejectedError instanceof Error', userErr instanceof Error)
    test('UserRejectedError.name = "UserRejectedError"', userErr.name === 'UserRejectedError')

    const lockErr = new WalletLockedError()
    test('WalletLockedError code = 4002', lockErr.code === 4002)

    const notConnErr = new WalletNotConnectedError()
    test('WalletNotConnectedError code = 4003', notConnErr.code === 4003)

    const fundsErr = new InsufficientFundsError()
    test('InsufficientFundsError code = 4004', fundsErr.code === 4004)

    const popupErr = new PopupBlockedError()
    test('PopupBlockedError code = 4006', popupErr.code === 4006)

    const popupClosedErr = new PopupClosedError()
    test('PopupClosedError code = 4007', popupClosedErr.code === 4007)

    const timeoutErr = new TimeoutError()
    test('TimeoutError code = 4008', timeoutErr.code === 4008)

    // -----------------------------------------------------------------------
    // 5. ErrorCodes constants
    // -----------------------------------------------------------------------
    section('ErrorCodes Constants')
    test('ErrorCodes.USER_REJECTED = 4001', ErrorCodes.USER_REJECTED === 4001)
    test('ErrorCodes.WALLET_LOCKED = 4002', ErrorCodes.WALLET_LOCKED === 4002)
    test('ErrorCodes.WALLET_NOT_CONNECTED = 4003', ErrorCodes.WALLET_NOT_CONNECTED === 4003)
    test('ErrorCodes.INSUFFICIENT_FUNDS = 4004', ErrorCodes.INSUFFICIENT_FUNDS === 4004)
    test('ErrorCodes.POPUP_BLOCKED = 4006', ErrorCodes.POPUP_BLOCKED === 4006)
    test('ErrorCodes.POPUP_CLOSED = 4007', ErrorCodes.POPUP_CLOSED === 4007)
    test('ErrorCodes.TIMEOUT = 4008', ErrorCodes.TIMEOUT === 4008)

    // -----------------------------------------------------------------------
    // 6. fromErrorResponse reconstructs correct error types
    // -----------------------------------------------------------------------
    section('fromErrorResponse')
    test('fromErrorResponse(4001) -> UserRejectedError',
      fromErrorResponse({ code: 4001, message: 'test' }) instanceof UserRejectedError)
    test('fromErrorResponse(4002) -> WalletLockedError',
      fromErrorResponse({ code: 4002, message: 'test' }) instanceof WalletLockedError)
    test('fromErrorResponse(4003) -> WalletNotConnectedError',
      fromErrorResponse({ code: 4003, message: 'test' }) instanceof WalletNotConnectedError)
    test('fromErrorResponse(4004) -> InsufficientFundsError',
      fromErrorResponse({ code: 4004, message: 'test' }) instanceof InsufficientFundsError)
    test('fromErrorResponse(4006) -> PopupBlockedError',
      fromErrorResponse({ code: 4006, message: 'test' }) instanceof PopupBlockedError)
    test('fromErrorResponse(4007) -> PopupClosedError',
      fromErrorResponse({ code: 4007, message: 'test' }) instanceof PopupClosedError)
    test('fromErrorResponse(4008) -> TimeoutError',
      fromErrorResponse({ code: 4008, message: 'test' }) instanceof TimeoutError)

    // -----------------------------------------------------------------------
    // 7. RpcMethods constants
    // -----------------------------------------------------------------------
    section('RPC Method Names')
    test('CONNECT = "connect"', RpcMethods.CONNECT === 'connect')
    test('DISCONNECT = "disconnect"', RpcMethods.DISCONNECT === 'disconnect')
    test('SIGN_TRANSACTION = "signTransaction"', RpcMethods.SIGN_TRANSACTION === 'signTransaction')
    test('SIGN_MESSAGE = "signMessage"', RpcMethods.SIGN_MESSAGE === 'signMessage')
    test('INSCRIBE = "inscribe"', RpcMethods.INSCRIBE === 'inscribe')
    test('SEND_ORDINALS = "sendOrdinals"', RpcMethods.SEND_ORDINALS === 'sendOrdinals')
    test('CREATE_LISTING = "createListing"', RpcMethods.CREATE_LISTING === 'createListing')
    test('PURCHASE_LISTING = "purchaseListing"', RpcMethods.PURCHASE_LISTING === 'purchaseListing')
    test('CANCEL_LISTING = "cancelListing"', RpcMethods.CANCEL_LISTING === 'cancelListing')
    test('TRANSFER_TOKEN = "transferToken"', RpcMethods.TRANSFER_TOKEN === 'transferToken')
    test('GET_BALANCE = "getBalance"', RpcMethods.GET_BALANCE === 'getBalance')
    test('GET_ORDINALS = "getOrdinals"', RpcMethods.GET_ORDINALS === 'getOrdinals')
    test('GET_TOKENS = "getTokens"', RpcMethods.GET_TOKENS === 'getTokens')
    test('GET_UTXOS = "getUtxos"', RpcMethods.GET_UTXOS === 'getUtxos')

    // -----------------------------------------------------------------------
    // 8. WalletNotConnectedError thrown when calling methods before connect
    // -----------------------------------------------------------------------
    section('Pre-connect Error Handling')
    try {
      await wallet.getBalance()
      test('getBalance() throws WalletNotConnectedError', false)
    } catch (e) {
      test('getBalance() throws WalletNotConnectedError', e instanceof WalletNotConnectedError)
    }

    try {
      await wallet.signMessage('test')
      test('signMessage() throws WalletNotConnectedError', false)
    } catch (e) {
      test('signMessage() throws WalletNotConnectedError', e instanceof WalletNotConnectedError)
    }

    try {
      await wallet.getOrdinals()
      test('getOrdinals() throws WalletNotConnectedError', false)
    } catch (e) {
      test('getOrdinals() throws WalletNotConnectedError', e instanceof WalletNotConnectedError)
    }

    // -----------------------------------------------------------------------
    // 9. Event system works
    // -----------------------------------------------------------------------
    section('Event System')
    let eventReceived = false
    const handler = () => { eventReceived = true }
    wallet.on('connect', handler)
    // Manually emit to test (events are eventemitter3)
    wallet.off('connect', handler)
    test('on/off does not throw', true)

    // -----------------------------------------------------------------------
    // 10. Detection helpers
    // -----------------------------------------------------------------------
    section('Detection Helpers')
    test('isOneSatInjected() returns boolean', typeof isOneSatInjected() === 'boolean')
    test('isOneSatAvailable() returns boolean', typeof isOneSatAvailable() === 'boolean')
    test('getInjectedOneSat() returns undefined (no extension)', getInjectedOneSat() === undefined)

    // -----------------------------------------------------------------------
    // 11. OneSatConfig defaults
    // -----------------------------------------------------------------------
    section('OneSatConfig Defaults')
    // We can't directly read private fields, but we can verify the provider was created
    test('createOneSat({}) creates a valid provider', createOneSat({}).isOneSat === true)
    test('createOneSat({ appName }) creates a valid provider', createOneSat({ appName: 'Test' }).isOneSat === true)

    // -----------------------------------------------------------------------
    // Summary
    // -----------------------------------------------------------------------
    const total = passed + failed
    summaryEl.innerHTML = `<strong>${passed}/${total} tests passed</strong>`
    summaryEl.style.borderColor = failed === 0 ? '#4f4' : '#f44'
    summaryEl.className = failed === 0 ? 'pass' : 'fail'

    if (failed > 0) {
      summaryEl.innerHTML += `<br><span class="fail">${failed} FAILED</span>`
    }
  </script>
</body>
</html>
