<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sign Message</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 400px;
      min-height: 400px;
      padding: 24px;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 24px;
      color: #fff;
      text-align: center;
    }
    .section {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .section-label {
      font-size: 12px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
    }
    .origin-value {
      font-size: 14px;
      color: #4cc9f0;
      word-break: break-all;
    }
    .message {
      font-family: monospace;
      font-size: 13px;
      color: #ccc;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
      background: #0f0f1e;
      padding: 12px;
      border-radius: 4px;
    }
    .warning {
      background: #422006;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #fcd34d;
    }
    .buttons {
      display: flex;
      gap: 12px;
      margin-top: auto;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .approve {
      background: #f59e0b;
      color: #000;
    }
    .approve:hover {
      background: #d97706;
    }
    .reject {
      background: #333;
      color: #fff;
    }
    .reject:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <h1>Sign Message</h1>

  <div class="section">
    <div class="section-label">Requesting site</div>
    <div class="origin-value" id="origin">Loading...</div>
  </div>

  <div class="section">
    <div class="section-label">Message to sign</div>
    <div class="message" id="message">Loading...</div>
  </div>

  <div class="warning">
    Only sign messages from sites you trust. Signing can prove your identity.
  </div>

  <div class="buttons">
    <button class="reject" id="reject">Cancel</button>
    <button class="approve" id="approve">Sign</button>
  </div>

  <script src="../popup.js" type="module"></script>
  <script type="module">
    const { getApprovalData, sendApprovalResponse } = window.popup

    async function init() {
      const data = await getApprovalData()
      if (!data) {
        document.getElementById('origin').textContent = 'Unknown'
        document.getElementById('message').textContent = 'No message'
        return
      }

      document.getElementById('origin').textContent = data.params?.origin || 'Unknown'
      document.getElementById('message').textContent = data.params?.message || 'No message'

      document.getElementById('approve').addEventListener('click', () => {
        sendApprovalResponse(data.requestId, true)
      })

      document.getElementById('reject').addEventListener('click', () => {
        sendApprovalResponse(data.requestId, false)
      })
    }

    init()
  </script>
</body>
</html>
