<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Connect Request</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 400px;
      min-height: 300px;
      padding: 24px;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 24px;
      color: #fff;
      text-align: center;
    }
    .origin {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: center;
    }
    .origin-label {
      font-size: 12px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
    }
    .origin-value {
      font-size: 16px;
      color: #4cc9f0;
      word-break: break-all;
    }
    .permissions {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .permissions h2 {
      font-size: 12px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 12px;
    }
    .permissions ul {
      list-style: none;
    }
    .permissions li {
      padding: 8px 0;
      font-size: 14px;
      color: #ccc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .permissions li::before {
      content: "✓";
      color: #4ade80;
    }
    .buttons {
      display: flex;
      gap: 12px;
      margin-top: auto;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .approve {
      background: #4ade80;
      color: #000;
    }
    .approve:hover {
      background: #22c55e;
    }
    .reject {
      background: #333;
      color: #fff;
    }
    .reject:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <h1>Connection Request</h1>

  <div class="origin">
    <div class="origin-label">Site requesting access</div>
    <div class="origin-value" id="origin">Loading...</div>
  </div>

  <div class="permissions">
    <h2>This site will be able to</h2>
    <ul>
      <li>View your wallet address</li>
      <li>View your balance</li>
      <li>Request transaction signatures</li>
    </ul>
  </div>

  <div class="buttons">
    <button class="reject" id="reject">Cancel</button>
    <button class="approve" id="approve">Connect</button>
  </div>

  <script src="../popup-connect.js"></script>
</body>
</html>
