<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Minimal Wallet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 360px;
      min-height: 400px;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #fff;
    }
    .section {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .section h2 {
      font-size: 12px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
    }
    .address {
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      color: #4cc9f0;
    }
    .balance {
      font-size: 24px;
      font-weight: bold;
      color: #4ade80;
    }
    .balance-loading {
      color: #888;
      font-size: 14px;
    }
    .sites-list {
      list-style: none;
    }
    .sites-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a4e;
    }
    .sites-list li:last-child {
      border-bottom: none;
    }
    .site-origin {
      font-size: 13px;
      color: #ccc;
    }
    .disconnect-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .disconnect-btn:hover {
      background: #dc2626;
    }
    .no-sites {
      color: #666;
      font-size: 13px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0f0f1a;
      color: #eee;
      font-size: 13px;
      font-family: monospace;
      margin-bottom: 12px;
    }
    input[type="password"] {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    input:focus {
      outline: none;
      border-color: #4cc9f0;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .primary {
      background: #4cc9f0;
      color: #000;
      width: 100%;
      margin-bottom: 8px;
    }
    .primary:hover {
      background: #22d3ee;
    }
    .secondary {
      background: #333;
      color: #fff;
      width: 100%;
    }
    .secondary:hover {
      background: #444;
    }
    .danger {
      background: #ef4444;
      color: white;
      width: 100%;
    }
    .danger:hover {
      background: #dc2626;
    }
    .backup-display {
      font-family: monospace;
      font-size: 10px;
      word-break: break-all;
      color: #f59e0b;
      background: #1a1a2e;
      padding: 12px;
      border-radius: 6px;
      margin-top: 12px;
      display: none;
      max-height: 150px;
      overflow-y: auto;
    }
    .setup-text {
      color: #888;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .divider {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin: 12px 0;
    }
    .lock-icon {
      display: inline-block;
      margin-right: 6px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .actions button {
      flex: 1;
    }
  </style>
</head>
<body>
  <h1>Minimal Wallet</h1>

  <!-- Setup Section (shown when no wallet) -->
  <div id="setup-section" style="display: none;">
    <div class="section">
      <h2>Setup Wallet</h2>
      <p class="setup-text">Generate a new key or import an existing WIF. Your keys will be encrypted with your passphrase.</p>
      <input type="password" id="setup-passphrase" placeholder="Enter passphrase (min 8 chars)" />
      <button class="primary" id="generate-btn">Generate New Wallet</button>
      <div class="divider">or</div>
      <input type="text" id="wif-input" placeholder="Enter WIF to import..." />
      <button class="secondary" id="import-btn">Import WIF</button>
    </div>
  </div>

  <!-- Unlock Section (shown when wallet is locked) -->
  <div id="unlock-section" style="display: none;">
    <div class="section">
      <h2><span class="lock-icon">🔒</span>Wallet Locked</h2>
      <p class="setup-text">Enter your passphrase to unlock the wallet.</p>
      <input type="password" id="unlock-passphrase" placeholder="Enter passphrase" />
      <button class="primary" id="unlock-btn">Unlock</button>
    </div>
  </div>

  <!-- Wallet Section (shown when unlocked) -->
  <div id="wallet-section" style="display: none;">
    <div class="section">
      <h2>Address</h2>
      <div class="address" id="address">Loading...</div>
    </div>

    <div class="section">
      <h2>Balance</h2>
      <div id="balance" class="balance-loading">Loading...</div>
    </div>

    <div class="section">
      <h2>Connected Sites</h2>
      <ul class="sites-list" id="sites">
        <li class="no-sites">Loading...</li>
      </ul>
    </div>

    <div class="section">
      <h2>Backup</h2>
      <button class="secondary" id="export-btn">Export Encrypted Backup</button>
      <div class="backup-display" id="backup-display"></div>
    </div>

    <div class="section">
      <button class="danger" id="lock-btn">Lock Wallet</button>
    </div>
  </div>

  <script src="../popup-main.js"></script>
</body>
</html>
